<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teste mobile click static</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: #020617;
        color: white;
        font-family: Arial, sans-serif;
      }

      body {
        padding: 30px;
      }

      button,
      a {
        position: relative;
        z-index: 999999;
        display: inline-block;
        padding: 20px;
        margin: 10px;
        border: 0;
        border-radius: 10px;
        color: black;
        font-weight: 800;
        text-decoration: none;
        pointer-events: auto;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <h1>Teste mobile click static</h1>
    <p id="status">Arquivo HTML estatico carregado</p>

    <button type="button" onclick="testeClick1()" style="background:white;">
      Testar clique
    </button>

    <button type="button" onclick="testeClickStorage()" style="background:#22c55e;">
      Testar localStorage
    </button>

    <a href="/" style="background:#38bdf8;">
      Voltar home link nativo
    </a>

    <button type="button" onclick="location.href='/'" style="background:#facc15;">
      Voltar home JS
    </button>

    <script>
      document.getElementById("status").textContent = "Script estatico executou";

      function testeClick1() {
        document.getElementById("status").textContent = "Botao 1 clicou";
        alert("Botão 1 clicou");
      }

      function testeClickStorage() {
        localStorage.setItem("testeMobile", "ok");
        document.getElementById("status").textContent = "localStorage ok";
        alert("localStorage ok");
      }
    </script>
  </body>
</html>
